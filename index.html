<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sade Lezzetler - Menü</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">🍽️ Sade Lezzetler</h1>
                <p class="tagline">Sağlıklı ve Lezzetli Seçenekler</p>
            </div>
        </header>

        <!-- Category Navigation -->
        <nav class="category-nav" id="categoryNav"></nav>

        <!-- Filter Toggle Button -->
        <div class="filter-container">
            <button id="filterToggleBtn" class="filter-toggle-btn">
                <span class="filter-icon">🔍</span>
                <span class="filter-text">Filtrele</span>
                <span id="filterCount" class="filter-count" style="display: none;">0</span>
            </button>
        </div>

        <!-- Filter Drawer -->
        <div id="filterDrawer" class="filter-drawer">
            <div class="filter-drawer-overlay"></div>
            <div class="filter-drawer-content">
                <div class="filter-drawer-header">
                    <h3>🔍 Filtreler</h3>
                    <button id="filterCloseBtn" class="filter-close-btn">✕</button>
                </div>
                
                <div class="filter-drawer-body">
                    <!-- Protein -->
                    <div class="filter-section">
                        <h4 class="filter-section-title">🍗 Protein</h4>
                        <div class="filter-options" id="proteinOptions"></div>
                    </div>
                    
                    <!-- Carb -->
                    <div class="filter-section">
                        <h4 class="filter-section-title">🍞 Karbonhidrat</h4>
                        <div class="filter-options" id="carbOptions"></div>
                    </div>
                    
                    <!-- Allergens -->
                    <div class="filter-section">
                        <h4 class="filter-section-title">⚠️ Alerjen Maddeler</h4>
                        <p class="allergen-note">(Seçilenler hariç tutulacak)</p>
                        <div class="filter-options" id="allergenOptions"></div>
                    </div>
                    
                    <!-- Price -->
                    <div class="filter-section">
                        <h4 class="filter-section-title">💰 Fiyat Aralığı</h4>
                        <div class="price-filters" id="priceFilters"></div>
                    </div>
                </div>
                
                <div class="filter-drawer-footer">
                    <button id="filterClearBtn" class="filter-btn-secondary">🔄 Temizle</button>
                    <button id="filterApplyBtn" class="filter-btn-primary">✅ Uygula</button>
                </div>
            </div>
        </div>

        <!-- Menu Container -->
        <main class="main-content">
            <div id="menuContainer" class="menu-container"></div>
        </main>

        <!-- Scroll to Top Button -->
        <button id="scrollToTopBtn" class="scroll-to-top">↑</button>
    </div>

    <!-- Image Modal -->
    <template id="imageModalTemplate">
        <div class="image-modal">
            <div class="image-modal-overlay"></div>
            <div class="image-modal-content">
                <button class="image-modal-close">✕</button>
                <img src="" alt="">
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
