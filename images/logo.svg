<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" width="260" height="110" role="img" aria-label="Sade Lezzetler">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
    </style>
  </defs>
  <!-- "Sade" in handwritten/casual script style -->
  <text
    x="130"
    y="72"
    font-family="Caveat, 'Dancing Script', 'Segoe Script', cursive"
    font-size="80"
    font-weight="700"
    fill="#6B8E23"
    text-anchor="middle"
    dominant-baseline="auto">Sade</text>
  <!-- Box background for "lezzetler" -->
  <rect x="44" y="78" width="172" height="30" rx="5" fill="#4A6741"/>
  <!-- "lezzetler" text inside box -->
  <text
    x="130"
    y="98"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="14"
    font-weight="600"
    fill="white"
    text-anchor="middle"
    letter-spacing="4"
    dominant-baseline="auto">lezzetler</text>
</svg>
